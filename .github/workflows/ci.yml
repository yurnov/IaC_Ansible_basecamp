name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install tooling
      run: |
        python -m pip install -U pip
        pip install ansible-core ansible-lint yamllint markdownlint-cli
    - name: Run yamllint
      run: yamllint -c .yamllint . || true
    - name: Run ansible-lint
      run: ansible-lint || true
    - name: Run markdownlint
      run: |
        markdownlint '**/*.md' || true

  molecule:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || github.base_ref == 'master'
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install Molecule and dependencies
      run: |
        python -m pip install -U pip
        pip install molecule docker molecule-docker ansible-core
    - name: Run molecule test for demo-01-nginx
      working-directory: demos/demo-01-nginx
      run: |
        molecule --version
        molecule test || true
